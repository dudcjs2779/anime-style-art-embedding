[model]
name = 'eva02_base_patch14_448.mim_in22k_ft_in22k_in1k' # eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
# name = "MANIQA" #002_CFANet_Res50_koniq
precision = 'fp16'  # amp
# resume = 'logs/25-02-12_00-17-45_eva02_base_patch14_448/checkpoint/epoch_13.pt'
save_frequency = 1
# max_save_count = 10

[train]
seed = 42
epochs = 30
batch_size = 16
# accum_freq = 4
# drop_path = 0.1
mse_cl_weight = 0.0
mse_weight = 1.0
nin_weight = 1.0

[validation]
valid = true
valid_batch_size = 24
valid_size = 0.35

[logger]
report_to = 'wandb'    # tensorboard, wandb
wandb_project_name = 'quality'  # nkoma-greyscale
# run_id = 'wi2vd2ce'

[optimizer]
lr = 3e-5
warmup = 300
wd = 0.05
beta1 = 0.9
beta2 = 0.999
esp = 1e-8
lr_decay = 1.0  # 0.7, 0.8

[data]
train = 'datasets/quality04_processed02/train_mse_quality_mid04.parquet'
image_key = 'image'
target_key = 'mse_label'
label_json = ''
workers = 0
mos_range = [[0, 100]]    # [0, 100], [25, 75]

[dataset]
image_size = [448, 448]
patch_size = 14
train_aug = "train_preset01"
valid_aug = "long_max_pad_valid"

[debug]
debug = false