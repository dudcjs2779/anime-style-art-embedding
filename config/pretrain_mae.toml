[model]
model_name = 'eva02_base_patch14_224.mim_in22k' # eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
precision = 'amp'  # amp, float16
# resume = 'logs/25-09-07_20-49-47_eva02_base_patch14_224.mim_in22k/checkpoint/epoch_7.pt'
pretrain = 'mae_logs/25-10-22_15-24-19_eva02_base_patch14_224.mim_in22k_lapj682u/checkpoint/epoch_30.pt'
save_frequency = 1
max_save_count = 10

[model_type]
embed_dim = 0
global_pool = ''    # avg, map, token(cls_token)

[decoder]
decoder_name = "eva_decoder"

[distributed]
horovod = false

[train]
seed = 42
epochs = 30
batch_size = 32
accum_freq = 4
norm_pix_loss = true
grad_clip_norm = 1.0

[validation]
valid = true
valid_batch_size = 64
val_frequency = 1

[optimizer]
opt_name = 'adamw'  # adamw, adamw8bit, dadaptation, prodigy
lr = 1e-04
wd = 0.05
beta1 = 0.9
beta2 = 0.95
esp = 1e-8
lr_decay = 0.9  # 0.7, 0.8
patch_embed_lr_mult = 1.0

[schaduler]
sch_name = 'cos'  # cos, cos_restart
min_lr = 1e-7
warmup = 150

[data]
train = 'datasets/pretrain01_640/train01.parquet'
valid = 'datasets/pretrain01_640/valid01.parquet'
image_key = 'image'
workers = 8

[dataset]
image_size = [224, 224]
patch_size = 14
train_aug = "mae_pretrain"
valid_aug = "simple_center_crop"

[logger]
report_to = 'wandb'    # tensorboard, wandb
wandb_project_name = 'pretrain_mae'  # nkoma-greyscale
# run_id = 'r15fyjq4'
log_every_n_steps = 10
log_local = false

[debug]
debug = false
