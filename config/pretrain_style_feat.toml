[model]
model_name = 'eva02_tiny_patch14_224.mim_in22k' # eva02_tiny_patch14_224.mim_in22k, eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_224.mim_in22k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
precision = 'amp'  # amp, float16
# resume = 'pretrain_log/26-10-12_12-22-04_eva02_base_patch14_448.mim_in22k_ft_in22k/checkpoint/epoch_5.pt'
# pretrain = 'pretrain_log/26-07-26_13-38-41_eva02_base_patch14_224.mim_in22k_1u164phs/checkpoint/epoch_29.pt' # pretrain/my_eva_decoder_512.pt
# pretrain = 'pretrain/tag_pretrain.pt' # pretrain/my_eva_decoder_512.pt
save_frequency = 1
max_save_count = 10

[model_kargs]
drop_path_rate = 0.1

[distributed]
horovod = false

[train]
device = 'cpu'
seed = 42
epochs = 15
batch_size = 3
accum_freq = 1
grad_clip_norm = 1.0
topk_rate = 1.0

[validation]
valid_batch_size = 16
val_frequency = 1

[optimizer]
opt_name = 'adamw8bit'  # adamw, adamw8bit, dadaptation, prodigy
lr = 1e-04
wd = 1e-04
beta1 = 0.9
beta2 = 0.95
esp = 1e-8
lr_decay = 0.9  # 0.7, 0.8
patch_embed_lr_mult = 1.0

[scheduler]
sch_name = 'cos'  # cos
min_lr = 2e-8
warmup = 0
warmup_ratio = 0
loss_dist_impl = 'bidir'
style_weight = [0.05, 0.05]
proto_weight = [1.0, 1.0]
proto_momentum = [0.9, 0.999]
BS_update_freq = 1000
BS_update_shape = 1.0
BS_update_start = 0.1
proto_ema_threshold_start_epoch = 6

[data]
train = 'datasets/pretrain01_640/csv_like/feat_train_valid04.parquet'
# valid = 'datasets/pretrain01_640/csv_like/feat_valid02.parquet'
test = 'datasets/pretrain01_640/csv_like/testset.parquet'
relation = 'datasets/pretrain01_640/class_similarity_weight_list.yaml'
feat_label = 'datasets/pretrain01_640/style_featrue_group2.yaml'
feat_class_weight_path = 'datasets/pretrain01_640/weight/feat_class_weights02.npy'
feat_pos_weight_path = 'datasets/pretrain01_640/weight/feat_pos_weights02.npy'
workers = 4

[dataset]
image_size = [224, 224]
patch_size = 14
train_aug = "bbox_crop_pretrain"    # pretrain_global_loacl, bbox_crop_pretrain
valid_aug = "simple_center_crop"
prototype_path = "pretrain_log/26-09-19_02-33-02_eva02_base_patch14_448.mim_in22k_ft_in22k_ye2tg6ik/26-09-20_22-47-35_prototypes_add04_bbox_crop_cs_cos_loss_all_class_448.pt" # datasets/pretrain01_640/proto_vectors/proto_484_01.pt

[sampler]
# num_postive = [2, 3]
hard_num = [1, 1]
same_num = [1, 1]

[logger]
report_to = 'wandb'    # tensorboard, wandb
wandb_project_name = 'pretrain_quality'  # nkoma-greyscale
# run_id = '46cipe25'
log_every_n_steps = 10
log_local = false

[debug]
debug = false
