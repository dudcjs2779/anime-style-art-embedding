[model]
model_name = 'eva02_base_patch14_224.mim_in22k' # eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
precision = 'amp'  # amp, float16
resume = 'style_log/25-09-29_22-43-22_eva02_base_patch14_224.mim_in22k/checkpoint/epoch_2.pt'
pretrain = 'pretrain_log/25-09-14_04-10-12_eva02_base_patch14_224.mim_in22k_qx2lxgde/checkpoint/epoch_30.pt'
save_frequency = 1
max_save_count = 10

[style_embed_head_kargs]
depth=1

[vision_kargs]
num_classes = 0
global_pool = ''

[text_kargs]
output_dim = 512

[distributed]
horovod = false

[train]
seed = 42
epochs = 30
batch_size = 8
accum_freq = 16
# drop_path = 0.1
grad_clip_norm = 3.0
time_range = 10 # n years
time_weight = 0.3
styled_loss_weight = 1.0
content_loss_weight = 1.0
style_loss_weight = 2.0
proj_style_loss = false
proj_style_loss_weight = 1.0

[loss]
same_class_weight = 1.0

[validation]
valid = true
valid_batch_size = 24
val_frequency = 1

[optimizer]
opt_name = 'adamw'  # adamw, adamw8bit, dadaptation, prodigy
lr = 1e-04
wd = 1e-04
beta1 = 0.9
beta2 = 0.95
esp = 1e-8
lr_decay = 0.9  # 0.7, 0.8
patch_embed_lr_mult = 1.0

[schaduler]
sch_name = 'cos'  # cos, cos_restart
min_lr = 1e-7
warmup = 0
loss_dist_impl = 'bidir'

[data]
train = 'datasets/pretrain01_640/style_train01.parquet'
valid = 'datasets/pretrain01_640/style_valid01.parquet'
workers = 8

[dataset]
image_size = [224, 224]
patch_size = 14
train_aug = "style_train02"
num_crops = 4

[sampler]
num_postive = [2, 3]

[logger]
report_to = 'wandb'    # tensorboard, wandb
wandb_project_name = 'style_pretrain'  
run_id = 'bqcbgtl8'
log_every_n_steps = 10
log_local = false

[debug]
debug = false
