[model]
model_name = 'eva02_base_patch14_clip_224' # eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
precision = 'amp'  # amp, float16
# resume = 'style_log/25-10-14_00-06-51_eva02_base_patch14_clip_224/checkpoint/epoch_16.pt'
pretrain = 'style_log/25-10-17_16-26-43_eva02_base_patch14_clip_224/checkpoint/epoch_30.pt' # pretrain/eva02_base_clip_patch16_modified.pt
save_frequency = 1
max_save_count = 10

# [style_embed_head_kargs]
# depth=2

[model_kargs]
custom_pool_type = 'eos'   # avg, eos, none

[vision_kargs]
num_classes = 512
global_pool = 'token'

[text_kargs]
output_dim = 512
eos_id = 49407
vocab_size = 49678
output_tokens = false
pool_type = 'none'   # eos, none
no_causal_mask = false

[distributed]
horovod = false

[train]
seed = 42
epochs = 30
batch_size = 16
accum_freq = 1
# drop_path = 0.1
grad_clip_norm = 3.0
time_range = 10 # n years
time_weight = 0.3

[loss]
same_class_weight = 1.0

[validation]
valid = true
valid_batch_size = 32
val_frequency = 1

[optimizer]
opt_name = 'adamw'  # adamw, adamw8bit, dadaptation, prodigy
lr = 2e-04
image_lr = 2e-04
text_lr = 2e-05
wd = 0.05
beta1 = 0.9
beta2 = 0.98
esp = 1e-8
lr_decay = 0.75  # 0.7, 0.8
patch_embed_lr_mult = 1.0

[schaduler]
sch_name = 'cos'  # cos, cos_restart
min_lr = 1e-7
warmup = 0
loss_dist_impl = 'bidir'

[data]
train = 'datasets/pretrain01_640/style_train01.parquet'
valid = 'datasets/pretrain01_640/style_valid01.parquet'
tag2id = 'datasets/pretrain01_640/tag_to_id.json'
token2tag = 'datasets/pretrain01_640/token_to_tag.json'
workers = 8

[dataset]
image_size = [224, 224]
patch_size = 14
train_aug = "style_train01"
valid_aug = "long_max_pad_valid"

[sampler]
num_postive = [2, 3]

[logger]
report_to = 'wandb'    # tensorboard, wandb
wandb_project_name = 'style_pretrain'  
# run_id = 'v60z16dp'
log_every_n_steps = 10
log_local = false

[debug]
debug = false
