[model]
model_name = 'maxvit_base_tf_384.in21k_ft_in1k' # eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
# name = "MANIQA" #002_CFANet_Res50_koniq
# precision = 'amp'  # amp, float16
precision = 'fp16'  # amp, float16
# resume = 'logs/25-07-28_23-32-50_eva02_base_patch14_448.mim_in22k_ft_in22k_in1k/checkpoint/epoch_16.pt'
pretrain = 'logs/25-09-11_23-00-48_maxvit_base_tf_384.in21k_ft_in1k/checkpoint/epoch_7.pt'
save_frequency = 1
max_save_count = 10

[train]
seed = 42
epochs = 30
batch_size = 8
accum_freq = 4
# drop_path = 0.1
mcw_by_score = 0.0
mse_weight = 1.0
nin_weight = 0.0
count_weight = false
cw_bins = 11
cw_alpha = 0.3

[validation]
valid = true
valid_batch_size = 24
valid_size = 0.2

[logger]
report_to = 'wandb'    # tensorboard, wandb
wandb_project_name = 'quality'  # nkoma-greyscale
# run_id = 'a79wd8e1'

[optimizer]
opt_name = 'adamw'  # adamw, adamw8bit, dadaptation, prodigy
lr = 1e-5
wd = 0.05
beta1 = 0.9
beta2 = 0.999
esp = 1e-8
lr_decay = 1.0  # 0.7, 0.8

[schaduler]
sch_name = 'cos'  # cos, cos_restart
min_lr = 1e-7
warmup = 1500
cycles = 5
cycle_multiplier = 1.0
re_g = 0.9
warmup_ratio = 0

[data]
train = 'datasets/quality04_processed_640/train_mse_quality_mid16.parquet'
image_key = 'image'
target_key = 'mse_label'
label_json = ''
workers = 8
mos_range = [0, 100]    # [0, 100]  [25, 75]
balanced_sample = false

[dataset]
image_size = [384, 384]
patch_size = 16
train_aug = "train_preset07"
valid_aug = "long_max_pad_valid"

[debug]
debug = false