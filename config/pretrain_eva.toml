[model]
model_name = 'eva02_base_patch14_224.mim_in22k' # eva02_small_patch14_336.mim_in22k_ft_in1k, eva02_base_patch14_448.mim_in22k_ft_in22k_in1k
precision = 'amp'  # amp, float16
# resume = 'logs/25-07-28_23-32-50_eva02_base_patch14_448.mim_in22k_ft_in22k_in1k/checkpoint/epoch_16.pt'
# pretrain = 'logs/25-06-26_13-40-05_eva02_base_patch14_448.mim_in22k_ft_in22k_in1k_hngfx670/checkpoint/epoch_1.pt'
save_frequency = 1
# max_save_count = 10

[model_type]
embed_dim = 0
global_pool = 'map'    # avg, map

[distributed]
horovod = false

[train]
seed = 42
epochs = 30
batch_size = 8
accum_freq = 4
# drop_path = 0.1
mcw_by_score = 0.0
mse_weight = 1.0
nin_weight = 0.0
count_weight = false
cw_bins = 11
cw_alpha = 0.3
# grad_clip_norm = null

[loss]
same_class_weight = 0.9

[validation]
valid = true
valid_batch_size = 16
valid_size = 0.2
val_frequency = 1

[optimizer]
opt_name = 'adamw'  # adamw, adamw8bit, dadaptation, prodigy
lr = 1e-04
wd = 1e-04
beta1 = 0.9
beta2 = 0.95
esp = 1e-8
lr_decay = 0.9  # 0.7, 0.8
patch_embed_lr_mult = 1.0

[schaduler]
sch_name = 'cos'  # cos, cos_restart
min_lr = 1e-7
warmup = 0
cycles = 5
cycle_multiplier = 1.0
re_g = 0.9
warmup_ratio = 0
loss_dist_impl = 'bidir'

[data]
train = 'datasets/pretrain_test640/train01_test.parquet'
valid = 'datasets/pretrain_test640/valid01_test.parquet'
image_key = 'image'
target_key = 'mse_label'
label_json = ''
workers = 0
mos_range = [0, 100]    # [0, 100]  [25, 75]
balanced_sample = false

[dataset]
image_size = [224, 224]
patch_size = 14
train_aug = "pretrain_base"
valid_aug = "long_max_pad_valid"

[logger]
report_to = 'tensorboard'    # tensorboard, wandb
wandb_project_name = 'quality'  # nkoma-greyscale
# run_id = 'a79wd8e1'
log_every_n_steps = 10
log_local = false

[debug]
debug = false
